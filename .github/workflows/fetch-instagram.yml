name: Daglig Instagram-henting

# Kjører fetch_instagram.py kl. 07 og kl. 20 norsk tid hver dag, og kan startes
# manuelt (Actions -> Daglig Instagram-henting -> Run workflow).
# Kveldskjøringen gir målinger nærmere 24 og 48 timer etter publisering for
# innlegg som publiseres på kvelden.
#
# Cron i GitHub Actions er alltid UTC. Hvert tidspunkt planlegges både for
# sommertid (UTC+2) og vintertid (UTC+1), og et kontrollsteg slipper bare
# gjennom utløseren som faktisk tilsvarer 07 eller 20 i Oslo i dag.
on:
  schedule:
    - cron: "0 5 * * *"    # 07:00 Oslo sommertid
    - cron: "0 6 * * *"    # 07:00 Oslo vintertid
    - cron: "0 18 * * *"   # 20:00 Oslo sommertid
    - cron: "0 19 * * *"   # 20:00 Oslo vintertid
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch-instagram
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Velg riktig tidspunkt for sommer-/vintertid
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Oslo date +%z)          # +0200 eller +0100
          offset_hours=$((10#${offset:1:2}))
          if [ "$EVENT" != "schedule" ]; then
            run=true
          else
            utc_hour=$((10#$(echo "$SCHEDULE" | cut -d' ' -f2)))
            oslo_hour=$(( (utc_hour + offset_hours) % 24 ))
            if [ "$oslo_hour" = "7" ] || [ "$oslo_hour" = "20" ]; then run=true; else run=false; fi
          fi
          echo "Oslo UTC-offset $offset, utløser '${SCHEDULE:-manuell}': run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.14"
          cache: pip

      - name: Installer avhengigheter
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Hent fra Instagram og lagre i Supabase
        if: steps.gate.outputs.run == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PYTHONIOENCODING: utf-8
        run: python fetch_instagram.py
