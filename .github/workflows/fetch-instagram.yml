name: Daglig Instagram-henting

# Kjører fetch_instagram.py hver morgen kl. 07 norsk tid, og kan startes manuelt
# (Actions -> Daglig Instagram-henting -> Run workflow).
#
# Cron i GitHub Actions er alltid UTC. 07:00 i Oslo er 05:00 UTC om sommeren
# (CEST) og 06:00 UTC om vinteren (CET), så vi planlegger begge og lar et
# kontrollsteg slippe gjennom bare den som stemmer med dagens sommer-/vintertid.
on:
  schedule:
    - cron: "0 5 * * *"   # 07:00 Oslo sommertid
    - cron: "0 6 * * *"   # 07:00 Oslo vintertid
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch-instagram
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Velg riktig tidspunkt for sommer-/vintertid
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Oslo date +%z)
          if [ "$EVENT" != "schedule" ]; then
            run=true
          elif [ "$offset" = "+0200" ] && [ "$SCHEDULE" = "0 5 * * *" ]; then
            run=true
          elif [ "$offset" = "+0100" ] && [ "$SCHEDULE" = "0 6 * * *" ]; then
            run=true
          else
            run=false
          fi
          echo "Oslo UTC-offset $offset, utløser '${SCHEDULE:-manuell}': run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.14"
          cache: pip

      - name: Installer avhengigheter
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Hent fra Instagram og lagre i Supabase
        if: steps.gate.outputs.run == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PYTHONIOENCODING: utf-8
        run: python fetch_instagram.py
